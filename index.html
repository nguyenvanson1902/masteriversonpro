    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
      .animate-shimmer {
        background: linear-gradient(to right, #4f46e5 20%, #a855f7 40%, #d946ef 60%, #4f46e5 80%);
        background-size: 200% auto;
        animation: shimmer 5s linear infinite;
      }
       @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeInUp {
        animation: fadeInUp 0.5s ease-out forwards;
      }
      /* New Aurora Effect */
      @keyframes aurora-glow {
        0%, 100% {
            text-shadow: 0 0 5px #fff, 0 0 10px #84cc16, 0 0 15px #84cc16, 0 0 20px #84cc16;
        }
        50% {
            text-shadow: 0 0 5px #fff, 0 0 10px #4ade80, 0 0 15px #4ade80, 0 0 20px #4ade80, 0 0 2px rgba(255,255,255,0.9);
        }
      }
      .animate-aurora {
        background: linear-gradient(270deg, #a3e635, #4ade80, #34d399, #a3e635);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: aurora-glow 6s ease-in-out infinite;
      }

      /* New Button Aurora Effect */
       @keyframes aurora-border {
        0%, 100% {
            border-color: #ef4444; /* red-500 */
            box-shadow: 0 0 15px 0px rgba(239, 68, 68, 0.6);
        }
        14% {
            border-color: #f97316; /* orange-500 */
            box-shadow: 0 0 15px 0px rgba(249, 115, 22, 0.6);
        }
        28% {
            border-color: #eab308; /* yellow-500 */
            box-shadow: 0 0 15px 0px rgba(234, 179, 8, 0.6);
        }
        42% {
            border-color: #84cc16; /* lime-500 */
            box-shadow: 0 0 15px 0px rgba(132, 204, 22, 0.6);
        }
        57% {
            border-color: #22c55e; /* green-500 */
            box-shadow: 0 0 15px 0px rgba(34, 197, 94, 0.6);
        }
        71% {
            border-color: #3b82f6; /* blue-500 */
            box-shadow: 0 0 15px 0px rgba(59, 130, 246, 0.6);
        }
        85% {
            border-color: #a855f7; /* purple-500 */
            box-shadow: 0 0 15px 0px rgba(168, 85, 247, 0.6);
        }
    }
    .animate-aurora-button {
      border: 2px solid transparent;
      animation: aurora-border 8s ease-in-out infinite;
    }
    /* New 3D Aurora Logo Effect */
    @keyframes logo-aurora {
        0%, 100% { text-shadow: 0 0 5px #fff, 0 0 10px #ef4444, 0 0 15px #ef4444, 2px 2px 2px #111; } /* Red */
        14%  { text-shadow: 0 0 5px #fff, 0 0 10px #f97316, 0 0 15px #f97316, 2px 2px 2px #111; } /* Orange */
        28%  { text-shadow: 0 0 5px #fff, 0 0 10px #eab308, 0 0 15px #eab308, 2px 2px 2px #111; } /* Yellow */
        42%  { text-shadow: 0 0 5px #fff, 0 0 10px #84cc16, 0 0 15px #84cc16, 2px 2px 2px #111; } /* Green */
        57%  { text-shadow: 0 0 5px #fff, 0 0 10px #3b82f6, 0 0 15px #3b82f6, 2px 2px 2px #111; } /* Blue */
        71%  { text-shadow: 0 0 5px #fff, 0 0 10px #6d28d9, 0 0 15px #6d28d9, 2px 2px 2px #111; } /* Indigo */
        85%  { text-shadow: 0 0 5px #fff, 0 0 10px #d946ef, 0 0 15px #d946ef, 2px 2px 2px #111; } /* Violet */
    }
    .logo-text-3d-aurora {
        font-size: 5rem;
        font-weight: 900; /* black */
        color: #e5e7eb; /* gray-200 */
        animation: logo-aurora 4s linear infinite;
        text-align: center;
        margin-bottom: 2rem;
        line-height: 1;
    }
     @media (max-width: 640px) {
      .logo-text-3d-aurora {
        font-size: 3.5rem;
      }
    }
    /* New 7-color glowing text effect */
    @keyframes aurora-glow-7-colors {
        0%, 100% { text-shadow: 0 0 5px #fff, 0 0 10px #ef4444, 0 0 15px #ef4444; } /* Red */
        14%  { text-shadow: 0 0 5px #fff, 0 0 10px #f97316, 0 0 15px #f97316; } /* Orange */
        28%  { text-shadow: 0 0 5px #fff, 0 0 10px #eab308, 0 0 15px #eab308; } /* Yellow */
        42%  { text-shadow: 0 0 5px #fff, 0 0 10px #84cc16, 0 0 15px #84cc16; } /* Lime */
        57%  { text-shadow: 0 0 5px #fff, 0 0 10px #3b82f6, 0 0 15px #3b82f6; } /* Blue */
        71%  { text-shadow: 0 0 5px #fff, 0 0 10px #6d28d9, 0 0 15px #6d28d9; } /* Indigo */
        85%  { text-shadow: 0 0 5px #fff, 0 0 10px #d946ef, 0 0 15px #d946ef; } /* Violet */
    }
    .text-aurora-glow-7-colors {
        color: #e5e7eb; /* gray-200 */
        animation: aurora-glow-7-colors 4s linear infinite;
    }
    </style>
